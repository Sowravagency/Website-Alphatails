<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Care Online Store & Booking</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #f8fafc; color: #1e293b; }
    .shop-header {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .shop-brand { display: flex; align-items: center; gap: 10px; }
    .brand-dot { width: 14px; height: 14px; background: #ea580c; border-radius: 50%; }
    .nav-tabs { display: flex; gap: 8px; }
    .tab-btn {
      background: transparent;
      border: 1px solid #cbd5e1;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #475569;
    }
    .tab-btn.active { background: #ea580c; color: #fff; border-color: #ea580c; }
    .container { max-width: 1200px; margin: 28px auto; padding: 0 20px; }
    .section { display: none; }
    .section.active { display: block; }
    
    .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .filters select { padding: 9px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; background: #fff; }

    .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .product-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .tag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; background: #f1f5f9; color: #334155; }
    .tag-cat { background: #ffedd5; color: #c2410c; }
    .tag-breed { background: #e0e7ff; color: #4338ca; }
    .product-card h3 { font-size: 16px; margin-bottom: 4px; color: #0f172a; }
    .company { font-size: 12px; color: #64748b; margin-bottom: 12px; }
    .meta { font-size: 13px; color: #475569; border-top: 1px solid #f1f5f9; padding-top: 10px; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
    .price { font-size: 20px; font-weight: 700; color: #0f172a; }
    .buy-btn { background: #ea580c; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; }

    .booking-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 28px;
      max-width: 600px;
      margin: 0 auto;
    }
    .booking-card h2 { margin-bottom: 6px; color: #0f172a; }
    .booking-card p { font-size: 14px; color: #64748b; margin-bottom: 20px; }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
    .input-group input, .input-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .btn-primary { background: #ea580c; color: #fff; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: 700; font-size: 15px; cursor: pointer; }
    .success-msg { margin-top: 14px; color: #16a34a; font-weight: 700; text-align: center; font-size: 14px; }
  </style>
</head>
<body>

  <header class="shop-header">
    <div class="shop-brand">
      <span class="brand-dot"></span>
      <h2>Pet Care Store & Clinic</h2>
    </div>
    <nav class="nav-tabs">
      <button class="tab-btn active" onclick="switchShopTab('shop')">Pet Shop Catalogue</button>
      <button class="tab-btn" onclick="switchShopTab('booking')">Book Appointment 🐾</button>
    </nav>
  </header>

  <main class="container">

    <!-- SHOP CATALOGUE TAB -->
    <section id="shop-section" class="section active">
      <div class="filters">
        <select id="filter-category" onchange="renderCustomerShop()">
          <option value="ALL">All Categories</option>
          <option value="Dry Food">Dry Food</option>
          <option value="Medicines">Medicines</option>
          <option value="Gravy">Gravy</option>
          <option value="Gravies">Gravies</option>
        </select>
        <select id="filter-pet" onchange="renderCustomerShop()">
          <option value="ALL">All Pets</option>
          <option value="Dog">Dog</option>
          <option value="Cat">Cat</option>
          <option value="Puppy">Puppy</option>
          <option value="Kitten">Kitten</option>
        </select>
      </div>
      <div id="shop-grid" class="shop-grid"></div>
    </section>

    <!-- BOOKING APPOINTMENT TAB -->
    <section id="booking-section" class="section">
      <div class="booking-card">
        <h2>Book a Clinic Appointment</h2>
        <p>Schedule a vet consultation, vaccination, or pet grooming session.</p>
        
        <form id="customer-booking-form" onsubmit="submitCustomerBooking(event)">
          <div class="input-group">
            <label>Your Name (Pet Parent) *</label>
            <input type="text" id="c-owner" required placeholder="e.g., Rajesh Kumar">
          </div>

          <div class="input-group">
            <label>Pet Name & Type *</label>
            <input type="text" id="c-pet" required placeholder="e.g., Bruno (Dog)">
          </div>

          <div class="input-group">
            <label>Select Service *</label>
            <select id="c-service" required>
              <option value="General Consultation">General Consultation</option>
              <option value="Full Grooming & Bath">Full Grooming & Bath</option>
              <option value="Vaccination">Vaccination</option>
              <option value="Tick & Flea Treatment">Tick & Flea Treatment</option>
            </select>
          </div>

          <div class="form-row">
            <div class="input-group">
              <label>Preferred Date *</label>
              <input type="date" id="c-date" required>
            </div>
            <div class="input-group">
              <label>Preferred Time Slot *</label>
              <input type="time" id="c-time" required>
            </div>
          </div>

          <button type="submit" class="btn-primary">Confirm Appointment Booking</button>
          <p id="booking-success" class="success-msg hidden">✔ Appointment booked successfully! The clinic will review and confirm shortly.</p>
        </form>
      </div>
    </section>

  </main>

  <script src="https://xukjlwsidurvtxqouqvd.supabase.co"></script>
  <script src="shop.js"></script>
</body>
</html>

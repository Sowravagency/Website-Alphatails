<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up | AlphaTails</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = "https://xukjlwsidurvtxqouqvd.supabase.co";
        const supabaseKey = "YOUR_MATCHING_ANON_KEY_HERE";
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
    </script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#E0F7FA]/60 min-h-screen flex items-center justify-center p-4 text-[#023047]">

    <div class="bg-white w-full max-w-md rounded-3xl shadow-xl border border-[#ccfbf1] p-8">
        <!-- Logo -->
        <div class="text-center mb-6">
            <a href="index.html" class="inline-flex items-center gap-2">
                <span class="w-10 h-10 rounded-xl bg-[#0f766e] text-white flex items-center justify-center font-bold text-lg">🐾</span>
                <span class="text-2xl font-extrabold tracking-tight text-[#023047]">ALPHATAILS</span>
            </a>
            <p class="text-xs text-slate-500 mt-2">Sign in to book appointments or order pet essentials</p>
        </div>

        <!-- Tabs -->
        <div class="grid grid-cols-2 bg-slate-100 p-1 rounded-xl mb-6">
            <button type="button" id="tabLogin" onclick="switchTab('login')" class="py-2 text-sm font-bold rounded-lg bg-white text-[#0f766e] shadow-sm transition">Login</button>
            <button type="button" id="tabSignup" onclick="switchTab('signup')" class="py-2 text-sm font-bold rounded-lg text-slate-500 hover:text-[#023047] transition">Sign Up</button>
        </div>

        <!-- Auth Form -->
        <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
            <div id="nameField" class="hidden">
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Full Name</label>
                <input type="text" id="authName" placeholder="e.g. Karthik Reddy" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-[#0f766e] focus:outline-none text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Email Address</label>
                <input type="email" id="authEmail" required placeholder="you@example.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-[#0f766e] focus:outline-none text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Password</label>
                <input type="password" id="authPassword" required minlength="6" placeholder="Minimum 6 characters" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-[#0f766e] focus:outline-none text-sm">
            </div>

            <button type="submit" id="authSubmitBtn" class="w-full py-3.5 rounded-xl bg-[#0f766e] hover:bg-[#115e59] text-white font-bold text-sm shadow-md transition">
                Login to AlphaTails
            </button>

            <p id="authMessage" class="text-xs text-center font-semibold mt-2"></p>
        </form>

        <div class="text-center mt-6">
            <a href="index.html" class="text-xs font-semibold text-slate-500 hover:text-[#0f766e]">← Back to Home</a>
        </div>
    </div>

    <script>
        let mode = 'login';

        function switchTab(selectedMode) {
            mode = selectedMode;
            const nameField = document.getElementById('nameField');
            const submitBtn = document.getElementById('authSubmitBtn');
            const tabLogin = document.getElementById('tabLogin');
            const tabSignup = document.getElementById('tabSignup');
            document.getElementById('authMessage').textContent = '';

            if (mode === 'signup') {
                nameField.classList.remove('hidden');
                document.getElementById('authName').required = true;
                submitBtn.textContent = 'Create Account';
                tabSignup.className = "py-2 text-sm font-bold rounded-lg bg-white text-[#0f766e] shadow-sm transition";
                tabLogin.className = "py-2 text-sm font-bold rounded-lg text-slate-500 hover:text-[#023047] transition";
            } else {
                nameField.classList.add('hidden');
                document.getElementById('authName').required = false;
                submitBtn.textContent = 'Login to AlphaTails';
                tabLogin.className = "py-2 text-sm font-bold rounded-lg bg-white text-[#0f766e] shadow-sm transition";
                tabSignup.className = "py-2 text-sm font-bold rounded-lg text-slate-500 hover:text-[#023047] transition";
            }
        }

        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;
            const fullName = document.getElementById('authName').value.trim();
            const msgEl = document.getElementById('authMessage');
            const btn = document.getElementById('authSubmitBtn');

            btn.disabled = true;
            btn.textContent = 'Please wait...';
            msgEl.textContent = '';

            try {
                let result;
                if (mode === 'signup') {
                    result = await supabaseClient.auth.signUp({
                        email,
                        password,
                        options: { data: { full_name: fullName } }
                    });
                } else {
                    result = await supabaseClient.auth.signInWithPassword({ email, password });
                }

                if (result.error) throw result.error;

                msgEl.className = "text-xs text-center font-semibold text-teal-700 mt-2";
                msgEl.textContent = mode === 'signup' ? 'Account created! Redirecting...' : 'Login successful! Redirecting...';

                // Send user back to the page they came from (e.g., booking.html or shop.html)
                const params = new URLSearchParams(window.location.search);
                const redirectUrl = params.get('redirect') || 'index.html';
                setTimeout(() => { window.location.href = redirectUrl; }, 800);

            } catch (err) {
                msgEl.className = "text-xs text-center font-semibold text-red-600 mt-2";
                msgEl.textContent = err.message || 'Authentication failed. Please try again.';
                btn.disabled = false;
                btn.textContent = mode === 'signup' ? 'Create Account' : 'Login to AlphaTails';
            }
        }
    </script>
</body>
</html>

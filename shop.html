<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Tails - Pet Accessories & Shop</title>
    <link rel="stylesheet" href="shop.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="shop-navbar">
        <div class="shop-brand">
            <h2>
                <span class="brand-text-alpha">Alpha</span><span class="brand-text-tails">tails</span>
            </h2>
        </div>
        <div class="shop-nav-links">
            <a href="shop.html" class="active"><i class="fa-solid fa-store"></i> Pet Shop</a>
            <a href="index.html" target="_blank"><i class="fa-solid fa-user-doctor"></i> Clinic Portal</a>
        </div>
    </header>

    <section class="pastel-hero-pattern">
        <div class="hero-content">
            <span class="hero-badge"><i class="fa-solid fa-paw"></i> Verified Clinic Quality</span>
            <h1>Pet Food & Accessories Store</h1>
            <p>Explore category-wise nutrition, wet gravies, medicines, and accessories for cats and dogs.</p>
        </div>
    </section>

    <main class="shop-container">
        <div class="shop-filter-bar">
            <button class="filter-btn active" onclick="filterShop('all', this)"><i class="fa-solid fa-border-all"></i> All Products</button>
            <button class="filter-btn" onclick="filterShop('Dry food', this)"><i class="fa-solid fa-bone"></i> Dry Food</button>
            <button class="filter-btn" onclick="filterShop('medicines', this)"><i class="fa-solid fa-pills"></i> Medicines</button>
            <button class="filter-btn" onclick="filterShop('Gravy', this)"><i class="fa-solid fa-bowl-food"></i> Gravy</button>
            <button class="filter-btn" onclick="filterShop('Gravies', this)"><i class="fa-solid fa-bowl-rice"></i> Gravies</button>
        </div>

        <div class="shop-grid" id="customer-shop-grid">
            <!-- Dynamically populated -->
        </div>
    </main>

    <footer class="shop-footer">
        <p>&copy; 2026 Alpha Tails Clinic & Pet Store. All rights reserved.</p>
    </footer>

    <script src="shop.js"></script>
</body>
</html>
